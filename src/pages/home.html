<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/components/layout.css" />
    <link rel="stylesheet" href="../shared/global/body.css" />
    <link rel="stylesheet" href="../../src/modules/player-bar/ui/index.css" />
    <link rel="stylesheet" href="../shared/settings/fonts.css" />
    <link rel="stylesheet" href="../shared/settings/variables.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="app-layout">
      <section class="area-sidebar"></section>
      <header class="area-header"></header>
      <main class="area-main"></main>
      <footer class="area-player-bar">
        <div class="now-playing">
          <div class="now-playing__image">
            <img src="../../assets/images/music-img.webp" alt="" />
          </div>
          <div class="now-playing__song">
            <div class="now-playing__description">
              <p class="now-playing__title">Grand Escape (feat. Tokio Miura)</p>
              <p class="now-playing__artists">RADWIMPS, Toko Miura</p>
            </div>
            <div class="now-playing__favorite">
              <img
                src="../../assets/images/heart.svg"
                width="16"
                height="16"
                alt="Agregar a favoritos"
              />
            </div>
          </div>
        </div>

        <div class="player-controls">
          <div class="player-controls__actions">
            <div class="player-controls__previous">
              <img
                src="../../assets/images/prev.svg"
                width="14"
                height="13"
                alt=""
              />
            </div>
            <div class="player-controls__play">
              <img
                src="../../assets/images/play-white.svg"
                width="40"
                height="40"
                alt=""
              />
            </div>
            <div class="player-controls__next">
              <img
                src="../../assets/images/next.svg"
                width="14"
                height="13"
                alt=""
              />
            </div>
          </div>
          <div class="player-controls__progress">
            <img
              src="../../assets/images/player.svg"
              width="566"
              height="14"
              alt=""
            />
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
